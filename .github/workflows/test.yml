name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (go vet, gofmt)
        run: make lint
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      # Includes the read-only guarantee tests (internal/matrix) and the
      # fake-homeserver allowlist checks: any violation fails the build.
      - name: Test
        run: go test -race -count=1 ./...
      - name: Cross-build all platforms and check size budget
        run: make dist size

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
