name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      # Includes the read-only guarantee tests (internal/matrix) and the
      # fake-homeserver allowlist checks: any violation fails CI.
      - name: Test
        run: go test -race ./...
      - name: Cross-build and size budget
        run: make size
